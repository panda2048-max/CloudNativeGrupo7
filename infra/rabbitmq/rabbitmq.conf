# Configuracion comun a los 2 nodos del cluster.

cluster_name = timetogame

# Formacion automatica del cluster: cada nodo conoce la lista de miembros y,
# al arrancar, se une al que ya este corriendo.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Las colas de la aplicacion son quorum (las declaran los microservicios):
# se replican en ambos nodos. Con 2 nodos la mayoria es 2 de 2, asi que hay
# replicacion pero no tolerancia a la caida de un nodo; para eso hacen falta 3.

management.tcp.port = 15672
listeners.tcp.default = 5672
