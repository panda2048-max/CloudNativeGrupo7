# Cluster RabbitMQ de 2 nodos para TimeToGame.
#
#   docker compose up -d                  # levanta ambos nodos (rabbitmq-2 espera a que rabbitmq-1 este sano)
#   docker compose exec rabbitmq-1 rabbitmqctl cluster_status
#
# Los nodos forman el cluster solos al arrancar (peer discovery classic_config,
# ver rabbitmq.conf) y comparten la Erlang cookie definida en .env. Los puertos
# solo se publican en 127.0.0.1: las aplicaciones corren en la misma maquina y
# el broker no queda expuesto a internet.
name: timetogame-rabbitmq

x-rabbitmq-nodo: &nodo
  image: rabbitmq:4.1.8-management
  restart: unless-stopped
  environment:
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Definir RABBITMQ_ERLANG_COOKIE en .env}
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Definir RABBITMQ_DEFAULT_USER en .env}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Definir RABBITMQ_DEFAULT_PASS en .env}
  mem_limit: 450m
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

services:
  rabbitmq-1:
    <<: *nodo
    hostname: rabbitmq-1
    container_name: rabbitmq-1
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # Management UI / API HTTP
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-1-data:/var/lib/rabbitmq

  rabbitmq-2:
    <<: *nodo
    hostname: rabbitmq-2
    container_name: rabbitmq-2
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-2-data:/var/lib/rabbitmq

volumes:
  rabbitmq-1-data:
  rabbitmq-2-data:
