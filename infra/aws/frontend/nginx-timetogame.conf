# /etc/nginx/sites-available/timetogame  (enlazar en sites-enabled y borrar "default")
# Reemplazar <IP_ELASTICA> y <IP_BACKEND>. certbot --nginx agrega despues el bloque 443 y la
# redireccion de 80 a HTTPS sobre este mismo archivo.
server {
    listen 80;
    server_name <IP_ELASTICA>.nip.io;

    root /var/www/timetogame;
    index index.html;

    # SPA: cualquier ruta del router de React devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tendencias en vivo (Server-Sent Events). El API Gateway no mantiene
    # conexiones abiertas: el stream va directo al backend por este proxy,
    # mismo origen que la SPA y sin buffering para que cada evento llegue al instante.
    location /api/public/stream/ {
        proxy_pass http://<IP_BACKEND>:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
