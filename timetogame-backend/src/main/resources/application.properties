spring.application.name=Timetogame

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/timetogame?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8000

# Identity Provider (Microsoft Entra ID / Azure AD). El backend no conoce
# contrasenas ni emite tokens: solo valida los que llegan firmados por este
# issuer. Reemplazar <TENANT_ID> y <CLIENT_ID_API> (o definir OIDC_ISSUER_URI
# / OIDC_AUDIENCE en application-local.properties) con los valores reales
# del App registration "timetogame-api" creado en https://entra.microsoft.com.
#
# Dos detalles no obvios de Azure AD (si se omiten, el JWT llega con iss/aud
# invalidos y el backend rechaza todo con 401):
#   1. El manifiesto de "timetogame-api" debe tener
#      api.requestedAccessTokenVersion = 2, si no Azure emite tokens v1.0
#      (iss = https://sts.windows.net/<tenant>/, no matchea el issuer-uri
#      de abajo que es v2.0).
#   2. Para un scope personalizado (api://<client-id>/access_as_user), el
#      claim "aud" del access token es el Client ID (GUID) del recurso, NO
#      "api://<client-id>" (aunque ese sea el Application ID URI expuesto).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://login.microsoftonline.com/<TENANT_ID>/v2.0}
app.oidc.audience=${OIDC_AUDIENCE:<CLIENT_ID_API>}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}