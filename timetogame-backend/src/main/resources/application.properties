spring.application.name=Timetogame

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/timetogame?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8000

# Identity Provider (Keycloak). El backend no conoce contrasenas ni emite
# tokens: solo valida los que llegan firmados por este issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8080/realms/timetogame}
app.oidc.audience=${OIDC_AUDIENCE:timetogame-api}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}