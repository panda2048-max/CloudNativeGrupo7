spring.application.name=Timetogame

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/timetogame?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8000

# Identity Provider (Microsoft Entra ID / Azure AD). El backend no conoce
# contrasenas ni emite tokens: solo valida los que llegan firmados por este
# issuer. Reemplazar <TENANT_ID> y <CLIENT_ID_API> (o definir OIDC_ISSUER_URI
# / OIDC_AUDIENCE en application-local.properties) con los valores reales
# del App registration "timetogame-api" creado en https://entra.microsoft.com.
#
# Dos detalles no obvios de Azure AD (si se omiten, el JWT llega con iss/aud
# invalidos y el backend rechaza todo con 401):
#   1. El manifiesto de "timetogame-api" debe tener
#      api.requestedAccessTokenVersion = 2, si no Azure emite tokens v1.0
#      (iss = https://sts.windows.net/<tenant>/, no matchea el issuer-uri
#      de abajo que es v2.0).
#   2. Para un scope personalizado (api://<client-id>/access_as_user), el
#      claim "aud" del access token es el Client ID (GUID) del recurso, NO
#      "api://<client-id>" (aunque ese sea el Application ID URI expuesto).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://login.microsoftonline.com/<TENANT_ID>/v2.0}
app.oidc.audience=${OIDC_AUDIENCE:<CLIENT_ID_API>}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# RabbitMQ. guest/guest solo funciona contra un broker en localhost; en AWS se
# usa un usuario propio via variables de entorno. RABBITMQ_ADDRESSES admite
# varios nodos del cluster separados por coma (ej. localhost:5672,localhost:5673):
# el cliente se conecta al primero disponible y reconecta a otro si ese cae.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Si el broker esta caido, publicar no debe dejar colgada la peticion HTTP.
spring.rabbitmq.connection-timeout=5s
# Confirmaciones del broker y devolucion de mensajes no enrutables al productor.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

app.messaging.notificaciones.max-reintentos=${NOTIFICACIONES_MAX_REINTENTOS:3}
app.messaging.notificaciones.retraso-reintento=${NOTIFICACIONES_RETRASO_REINTENTO:5s}
app.messaging.documentos.max-reintentos=${DOCUMENTOS_MAX_REINTENTOS:3}
app.messaging.documentos.retraso-reintento=${DOCUMENTOS_RETRASO_REINTENTO:5s}

# ---------------------------------------------------------------- Kafka
# Brokers del cluster (docker-compose de infra/kafka). Varios separados por
# coma: el cliente solo necesita uno vivo para descubrir el resto.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Productor: key String (id del videojuego) y value JSON tipado.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# acks=all + idempotencia: el broker confirma cuando la escritura esta en las
# replicas sincronizadas, y un reintento no duplica el mensaje.
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.request.timeout.ms=15000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.linger.ms=5
# Si Kafka esta caido, send() no debe bloquear mas de 3 s (corre en un hilo @Async).
spring.kafka.producer.properties.max.block.ms=3000
# Sin header __TypeId__: el contrato es el JSON, no el nombre de una clase Java.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumidor: ErrorHandlingDeserializer envuelve al deserializador JSON, asi un
# mensaje que no es JSON valido va al DLT en vez de botar el consumidor.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.Timetogame.streaming.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# Un grupo nuevo empieza desde lo mas antiguo que retiene el topico.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Si Kafka no esta al arrancar, la app sigue y los consumidores reintentan solos.
spring.kafka.admin.fail-fast=false
spring.kafka.admin.auto-create=true

# Topicos: 3 particiones x 3 replicas en el cluster; en local con 1 broker,
# KAFKA_TOPICOS_REPLICAS=1.
app.kafka.topicos.particiones=${KAFKA_TOPICOS_PARTICIONES:3}
app.kafka.topicos.replicas=${KAFKA_TOPICOS_REPLICAS:3}
app.kafka.topicos.min-insync-replicas=2
app.kafka.topicos.retencion-actividad=7d
app.kafka.topicos.retencion-dlt=14d
app.kafka.tendencias.ventana=${TENDENCIAS_VENTANA:10m}
app.kafka.tendencias.top=5
app.kafka.tendencias.consumidores=${TENDENCIAS_CONSUMIDORES:3}
app.kafka.tendencias.costo-procesamiento=${TENDENCIAS_COSTO_PROCESAMIENTO:0ms}
