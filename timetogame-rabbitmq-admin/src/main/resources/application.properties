spring.application.name=timetogame-rabbitmq-admin

spring.config.import=optional:classpath:application-local.properties

server.port=8001

# Mismo IDaaS y misma audiencia que timetogame-backend: el access token que
# obtiene el frontend sirve para ambos microservicios. Solo el rol ADMIN
# puede administrar la topologia (ver security/SecurityConfig).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://login.microsoftonline.com/<TENANT_ID>/v2.0}
app.oidc.audience=${OIDC_AUDIENCE:<CLIENT_ID_API>}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Conexion AMQP: crear/eliminar colas, exchanges y bindings (AmqpAdmin).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# API HTTP de management: listar/consultar recursos (AMQP no permite listar).
# Usa las mismas credenciales y vhost que la conexion AMQP.
rabbit-admin.management-url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
# Prefijos que la API se niega a eliminar: la topologia propia del sistema y
# los recursos reservados del broker. Borrarlos romperia la mensajeria.
rabbit-admin.recursos-protegidos=${RABBIT_ADMIN_RECURSOS_PROTEGIDOS:timetogame.catalogo.,timetogame.admin.,amq.}
