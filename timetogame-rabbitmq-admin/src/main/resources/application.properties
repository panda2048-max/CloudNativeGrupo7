spring.application.name=timetogame-rabbitmq-admin

spring.config.import=optional:classpath:application-local.properties

server.port=8001

# Mismo IDaaS y misma audiencia que timetogame-backend: el access token que
# obtiene el frontend sirve para ambos microservicios. Solo el rol ADMIN
# puede administrar la topologia (ver security/SecurityConfig).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://login.microsoftonline.com/<TENANT_ID>/v2.0}
app.oidc.audience=${OIDC_AUDIENCE:<CLIENT_ID_API>}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Conexion AMQP: crear/eliminar colas, exchanges y bindings (AmqpAdmin).
# RABBITMQ_ADDRESSES: nodos del cluster separados por coma; el cliente usa el
# primero disponible y reconecta a otro si ese cae.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# API HTTP de management: listar/consultar recursos (AMQP no permite listar).
# Usa las mismas credenciales y vhost que la conexion AMQP. Una URL por nodo,
# separadas por coma: si el primero no responde se consulta el siguiente.
rabbit-admin.management-urls=${RABBITMQ_MANAGEMENT_URLS:http://localhost:15672}
# Prefijos que la API se niega a eliminar: la topologia propia del sistema y
# los recursos reservados del broker. Borrarlos romperia la mensajeria.
rabbit-admin.recursos-protegidos=${RABBIT_ADMIN_RECURSOS_PROTEGIDOS:timetogame.catalogo.,timetogame.documentos.,timetogame.admin.,amq.}

# ---------------------------------------------------------------- Kafka
# Administracion de topicos y consumer groups con AdminClient.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.client-id=timetogame-admin
spring.kafka.admin.properties.request.timeout.ms=8000
spring.kafka.admin.properties.default.api.timeout.ms=10000
# Este servicio no declara topicos: solo administra los que existen.
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
# Prefijos que la API se niega a eliminar: topicos del sistema e internos de Kafka.
kafka-admin.topicos-protegidos=${KAFKA_ADMIN_TOPICOS_PROTEGIDOS:timetogame.,__}
kafka-admin.timeout=10s
