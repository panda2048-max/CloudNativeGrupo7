# Copiar a /etc/nginx/sites-available/timetogame en la EC2 del frontend:
#   sudo ln -s /etc/nginx/sites-available/timetogame /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;

    root /var/www/timetogame;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # para que React Router la resuelva en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
